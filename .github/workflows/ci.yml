name: ci

on:
  push:
    branches: [main, feat/mario]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: install sdl2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: build
        run: cmake --build build -j
      - name: frontend target built
        run: cmake --build build --target gbemu-sdl -j
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: fetch test roms
        if: matrix.build_type == 'Release'
        run: ./tools/fetch-test-roms.sh
      - name: run test roms
        if: matrix.build_type == 'Release'
        run: BUILD_DIR=build ./tools/run-test-roms.sh

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install sdl2
        run: brew install sdl2
      - name: configure
        # homebrew's prefix is not on cmake's default search path
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2)"
      - name: build
        run: cmake --build build -j
      - name: frontend target built
        run: cmake --build build --target gbemu-sdl -j
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: fetch test roms
        run: ./tools/fetch-test-roms.sh
      - name: run test roms
        run: BUILD_DIR=build ./tools/run-test-roms.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format
        # pinned to the version developers run locally; apt's moves with the distro
        run: pip install clang-format==23.1.0
      - name: format check
        run: |
          find core frontend tests games \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0 clang-format --dry-run --Werror
      - name: generated opcodes up to date
        run: |
          python3 tools/gen_opcodes.py
          git diff --exit-code core/opcodes.inc tests/unit/opcode_meta.inc

  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install gbdk-2020
        run: |
          curl -fsSL -o gbdk.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          tar -xzf gbdk.tar.gz -C "$HOME"
          test -x "$HOME/gbdk/bin/lcc"
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGBDK_HOME="$HOME/gbdk"
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build -R 'flappy|crossy|mario|tetris' --output-on-failure

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: fetch roms
        run: ./tools/fetch-test-roms.sh
      - name: configure
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build-wasm --target gbemu-sdl -j

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGB_BUILD_FUZZERS=ON -DCMAKE_CXX_COMPILER=clang++
      - name: build fuzzers
        run: cmake --build build --target fuzz_header fuzz_savestate -j
      - name: fuzz header parser
        run: ./build/fuzz_header -max_total_time=45
      - name: fuzz savestate loader
        run: ./build/fuzz_savestate -max_total_time=45
