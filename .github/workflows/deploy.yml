name: deploy

# the browser build of the emulator with the four games, published to github pages on every push
# to main. the site is index.html + index.js + index.wasm from the emscripten build plus roms/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: configure
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build-wasm --target gbemu-sdl -j
      - name: assemble site
        run: |
          mkdir -p site/roms
          cp build-wasm/index.html build-wasm/index.js build-wasm/index.wasm site/
          cp assets/roms/tetris.gb assets/roms/flappy.gb assets/roms/crossy.gb assets/roms/mario.gbc site/roms/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
